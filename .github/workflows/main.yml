name: Generate HATVP JSON

on:
  workflow_dispatch: # Permet de lancer manuellement depuis l'onglet "Actions" de GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install fast-xml-parser

      - name: Run script
        run: node generate_data.js

      - name: Commit and push JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hatvp_data.json
          git commit -m "Update hatvp_data.json" || exit 0
          git push
